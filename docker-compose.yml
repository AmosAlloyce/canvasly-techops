services:
  opsos-app:
    build: .
    container_name: canvasly-opsos-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4000:4000"
    environment:
      - PORT=4000
      - N8N_BASE_URL=http://n8n:5678
      - DATABASE_URL=postgresql://canvasly:canvasly_oss@postgres:5432/canvasly_ops
      - REDIS_URL=redis://redis:6379
      - NTFY_URL=http://ntfy:80/canvasly-p1-oncall
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=llama-3.3-70b-versatile
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
    depends_on:
      - postgres
      - redis
      - n8n
      - ntfy

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: canvasly-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=canvasly_ops
      - DB_POSTGRESDB_USER=canvasly
      - DB_POSTGRESDB_PASSWORD=canvasly_oss
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    container_name: canvasly-postgres-pgvector
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=canvasly
      - POSTGRES_PASSWORD=canvasly_oss
      - POSTGRES_DB=canvasly_ops
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: canvasly-redis-queue
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: canvasly-ntfy-pager
    restart: unless-stopped
    command: serve
    ports:
      - "8085:80"

volumes:
  n8n_data:
  pg_data:
  redis_data:
